<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz de League of Legends</title>
</head>
<body>
    <header>
        <h1>Quiz de League of Legends</h1>
    </header>
    <main>
        <section>
            <h2>Responda às perguntas sobre os campeões</h2>
            <form action="https://postman-echo.com/post" method="post">
                <p>Preencha seus dados para começar a responder:</p>
                <div>
                    <label for="nome_id">Nome</label>
                    <input type="text" id="nome_id" name="nome">
                    <label for="sobrenome_id">Sobrenome</label>
                    <input type="text" id="sobrenome_id" name="sobrenome">
                </div>

                <fieldset>
                    <legend>Perguntas do Quiz</legend>
                
                    <div>
                        <p><label for="frase_id">Quem fala a frase "Regras foram feitas para ser quebradas... Igual a prédios! Ou pessoas!"?</label></p>
                        <select name="frase_campeao" id="frase_id">
                            <option value="vi">Vi</option>
                            <option value="jinx">Jinx</option>
                            <option value="caitlyn">Caitlyn</option>
                            <option value="lux">Lux</option>
                        </select>
                    </div>

                    <div>
                        <p>Qual destes campeões utiliza o poder de manipular o tempo?</p>
                        <input type="radio" id="p_ekko" name="poder_tempo" value="ekko">
                        <label for="p_ekko">Ekko</label><br>

                        <input type="radio" id="p_zed" name="poder_tempo" value="zed">
                        <label for="p_zed">Zed</label><br>

                        <input type="radio" id="p_shen" name="poder_tempo" value="shen">
                        <label for="p_shen">Shen</label><br>

                        <input type="radio" id="p_yasuo" name="poder_tempo" value="yasuo">
                        <label for="p_yasuo">Yasuo</label>
                    </div>

                    <div>
                        <p><label for="adc_azul_id">Qual é a Atiradora (ADC) clássica que tem o cabelo azul e usa uma metralhadora/lança-mísseis?</label></p>
                        <select name="adc_cabelo_azul" id="adc_azul_id">
                            <option value="ashes">Ashe</option>
                            <option value="jinx">Jinx</option>
                            <option value="kaisa">Kai'Sa</option>
                            <option value="vayne">Vayne</option>
                        </select>
                    </div>

                    <div>
                        <p><label for="posicao_id">Qual é a sua rota (role) principal no jogo?</label></p>
                        <select name="posicao_preferida" id="posicao_id">
                            <option value="top">Topo (Top)</option>
                            <option value="jungle">Caçador (Jungle)</option>
                            <option value="mid">Meio (Mid)</option>
                            <option value="adc">Atirador (ADC)</option>
                            <option value="support">Suporte</option>
                        </select>
                    </div>

                    <div>
                        <p><label for="clone_id">Qual destes personagens cria um clone de si mesmo?</label></p>
                        <select name="personagem_clone" id="clone_id">
                            <option value="shaco">Shaco</option>
                            <option value="garen">Garen</option>
                            <option value="darius">Darius</option>
                            <option value="lux">Lux</option>
                        </select>
                    </div>
                </fieldset>

                <br>
                <button type="submit">Enviar Respostas</button>
            </form>
        </section>
    </main>
</body>
</html>
